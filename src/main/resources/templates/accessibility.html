<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" th:href="@{/css/nav.css}" />
    <link rel="stylesheet" th:href="@{/css/accessibility.css}" />
    <link rel="stylesheet" th:href="@{/css/global.css}" />

    <title>Accessible Sidebar</title>
  </head>

  <body>
    <div th:replace="fragments/navigation :: nav"></div>
    <div class="container">
      <div class="hero">
        <div class="hero-content">
          <h1>Welcome to Skills Bursts!</h1>
          <p>Accessibility Settings</p>
        </div>
        <div class="hero-graphics">
          <div class="circle"></div>
          <div class="square"></div>
          <div class="triangle"></div>
        </div>
      </div>

      <div class="setting-group">
        <button id="zoom-in-page" class="btn">
          <i class="fas fa-search-plus fa-lg"></i>
        </button>
        <p>Zoom</p>
        <button id="zoom-out-page" class="btn">
          <i class="fas fa-search-minus fa-lg"></i>
        </button>
      </div>

      <div class="setting-group">
        <button id="font-zoom-in" class="btn">
          <i class="fas fa-plus fa-lg"></i>
        </button>
        <p>Text Size</p>
        <button id="font-zoom-out" class="btn">
          <i class="fas fa-minus fa-lg"></i>
        </button>
      </div>

      <div class="setting-group">
        <button id="increase-brightness" class="btn">
          <i class="fas fa-sun fa-lg"></i>
        </button>
        <p>Brightness</p>
        <button id="decrease-brightness" class="btn">
          <i class="fas fa-moon fa-lg"></i>
        </button>
      </div>

      <div class="setting-group">
        <button id="dark-mode-toggle" class="btn">
          Dark Mode &nbsp;
          <i class="fas fa-adjust fa-lg"></i>
        </button>
      </div>

      <div class="setting-group">
        <button id="font-toggle" class="btn">
          Readable Text &nbsp;
          <i class="fas fa-font fa-lg"></i>
        </button>
      </div>

      <div class="setting-group">
        <button id="speak" class="btn" onclick="speakText()">
          Speak Text &nbsp;
          <i class="fas fa-volume-up fa-lg"></i>
        </button>
      </div>
    </div>

    <script th:src="@{/js/accessibility.js}"></script>
  </body>

  <div th:replace="fragments/footer :: footer"></div>
</html>
